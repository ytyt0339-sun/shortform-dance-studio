# Cloudflare Worker 설정.
#
# 이 Worker 가 하는 일: 화면이 부르는 API 를 받고, 작업 기록을 R2 에 쓰고,
# 무거운 일은 AWS Lambda 에 넘기고, fal 에 맡긴 영상이 다 됐는지 1분마다 확인한다.
#
# 내 컴퓨터에서 시험 (계정 없이 됨):
#   cd worker && npx wrangler dev
name = "dance-studio"
main = "src/index.js"
compatibility_date = "2025-09-01"

# 만든 파일(그림·영상)을 두는 곳. 서버가 몇 대든 같은 것을 본다.
[[r2_buckets]]
binding = "FILES"
bucket_name = "dance-runs"

# 하루 편수 같은 작은 숫자. R2 보다 읽기가 빠르고 싸다.
[[kv_namespaces]]
binding = "COUNTS"
id = "0123456789abcdef0123456789abcdef"   # 계정 만든 뒤 진짜 값으로 바꾼다
                                        # (내 컴퓨터에서 시험할 때는 아무 값이나 된다)

[triggers]
crons = ["* * * * *"]     # 1분마다: fal 에 맡긴 영상이 다 됐는지 확인

[vars]
DAILY_VIDEOS = "2"
DAILY_VIDEOS_IP = "4"
REDO_LIMIT = "1"
KEEP_HOURS = "336"
# 임시 파일 주소에 서명할 때 쓰는 값. 올릴 때는 wrangler secret 으로 진짜 값을 넣는다.
LINK_SECRET = "시험용-아무거나"
BUILT_AT = "0"
# 비밀값(FAL_KEY, AWS 열쇠)은 여기 두지 않는다. wrangler secret put 으로 넣는다.
