# Cloudflare Worker 설정.
#
# 이 Worker 가 하는 일: 화면이 부르는 API 를 받고, 작업 기록을 R2 에 쓰고,
# 무거운 일은 AWS Lambda 에 넘기고, fal 에 맡긴 영상이 다 됐는지 1분마다 확인한다.
#
# 내 컴퓨터에서 시험 (계정 없이 됨):
#   cd worker && npx wrangler dev
name = "dance-studio"
main = "src/index.js"
compatibility_date = "2025-09-01"

# 화면(HTML)도 이 Worker 가 직접 내준다. 화면과 API 가 같은 주소를 쓰게 되어
# 화면 코드에서 API 주소를 고칠 일이 없고, 브라우저 보안(CORS) 문제도 없다.
[assets]
directory = "./public"
binding = "PAGE"

# 만든 파일(그림·영상)을 두는 곳. 서버가 몇 대든 같은 것을 본다.
[[r2_buckets]]
binding = "FILES"
bucket_name = "dance-runs"

# 하루 편수 같은 작은 숫자. R2 보다 읽기가 빠르고 싸다.
[[kv_namespaces]]
binding = "COUNTS"
id = "2a40d2be59974294ae757dff14fff5be"

[triggers]
crons = ["* * * * *"]     # 1분마다: fal 에 맡긴 영상이 다 됐는지 확인

[vars]
# 사람별 하루 한도는 끈다 (0 = 안 막음). 전체 월 한도로만 잠근다.
DAILY_VIDEOS = "0"
DAILY_VIDEOS_IP = "0"
REDO_LIMIT = "1"
KEEP_HOURS = "336"
# 서비스 전체 한도. 이걸 넘으면 아무도 새로 못 만든다 (요금 잠금장치).
# 클라우드 무료 한도는 월 1,000편쯤에서 걸리므로 그보다 낮게 둔다.
# 실제로 돈이 드는 건 fal 이다 — 월 150편이면 약 45만 원.
MAX_MONTH = "150"
# 하루 한도도 끈다 (0 = 안 막음)
MAX_DAY = "0"
BUILT_AT = "0"
# 비밀값(FAL_KEY, AWS 열쇠)은 여기 두지 않는다. wrangler secret put 으로 넣는다.
